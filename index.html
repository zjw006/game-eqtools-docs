<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏研究资料库 · 塔防档案 / 美术图鉴</title>
<style>
:root{
  --bg:#0c0e0c;--line:#2b3227;--ink:#e9e5d6;--ink-dim:#9aa090;
  --amber:#ffb225;--teal:#46c9a5;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono','Consolas',monospace;
  --bar-h:58px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}

/* ===== 顶部页签栏 ===== */
.tabbar{
  height:var(--bar-h);display:flex;align-items:center;gap:6px;padding:0 22px;
  background:rgba(12,14,12,.96);border-bottom:1px solid var(--line);
  position:relative;z-index:10;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.tabbar::-webkit-scrollbar{height:0}
.brand{
  display:flex;align-items:center;gap:9px;margin-right:20px;white-space:nowrap;
  font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--ink);
}
.brand::before{
  content:"";width:11px;height:11px;background:var(--amber);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);flex:none;
}
.brand small{font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.18em;font-weight:400}
.tabs{display:flex;gap:6px;height:100%;align-items:stretch}
.tab{
  appearance:none;border:none;background:none;cursor:pointer;
  display:flex;align-items:center;gap:9px;padding:0 18px;position:relative;
  color:var(--ink-dim);font-family:var(--sans);font-size:13.5px;font-weight:400;
  letter-spacing:.03em;white-space:nowrap;transition:color .25s;
}
.tab .num{font-family:var(--mono);font-size:10px;color:var(--teal);letter-spacing:.12em}
.tab:hover{color:var(--amber)}
.tab::after{
  content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:var(--amber);transform:scaleX(0);transition:transform .3s ease;
}
.tab.active{color:var(--ink);font-weight:500}
.tab.active::after{transform:scaleX(1)}
.hint{
  margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);
  letter-spacing:.1em;white-space:nowrap;
}
.hint b{color:var(--amber);font-weight:600}

/* ===== 内容面板 ===== */
.stage{position:relative;height:calc(100vh - var(--bar-h));height:calc(100dvh - var(--bar-h))}
.panel{
  position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .35s ease,visibility 0s linear .35s;
}
.panel.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease}
.panel iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* 图鉴加载提示 */
.loading{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;
  align-items:center;justify-content:center;background:var(--bg);z-index:2;
  font-family:var(--mono);font-size:11px;letter-spacing:.25em;color:var(--ink-dim);
}
.loading .ring{
  width:34px;height:34px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--amber);
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading.done{display:none}

@media(max-width:768px){
  .tabbar{padding:0 14px}
  .hint{display:none}
  .brand{margin-right:12px;font-size:13px}
}
@media(max-width:640px){
  .tabbar{padding:0 10px}
  .brand small{display:none}
  .brand{font-size:12.5px;margin-right:10px}
  .tab{padding:0 12px;font-size:12.5px}
  .tab .num{font-size:9px}
}
@media(max-width:480px){
  .tab{padding:0 9px;font-size:12px;gap:6px}
  .tab .num{display:none}
  .brand{font-size:12px;margin-right:8px}
}
</style>
</head>
<body>

<div class="tabbar">
  <div class="brand">游戏研究资料库 <small>GAME RESEARCH HUB</small></div>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-td" role="tab" aria-selected="true" aria-controls="panel-td" data-target="td">
      <span class="num">01</span>塔防研究档案
    </button>
    <button class="tab" id="tab-art" role="tab" aria-selected="false" aria-controls="panel-art" data-target="art">
      <span class="num">02</span>游戏美术图鉴
    </button>
    <button class="tab" id="tab-meta" role="tab" aria-selected="false" aria-controls="panel-meta" data-target="meta">
      <span class="num">03</span>天赋·成就·经济系统
    </button>
    <button class="tab" id="tab-ui" role="tab" aria-selected="false" aria-controls="panel-ui" data-target="ui">
      <span class="num">04</span>UI 美术设计
    </button>
    <button class="tab" id="tab-cyber" role="tab" aria-selected="false" aria-controls="panel-cyber" data-target="cyber">
      <span class="num">05</span>暗黑赛博
    </button>
  </div>
  <div class="hint">共 <b>5</b> 份档案 · 点击页签切换</div>
</div>

<div class="stage">
  <div class="panel show" id="panel-td" role="tabpanel" aria-labelledby="tab-td">
    <iframe src="game-eqtools-docs.html" title="塔防游戏全景研究档案"></iframe>
  </div>
  <div class="panel" id="panel-art" role="tabpanel" aria-labelledby="tab-art">
    <div class="loading" id="artLoading">
      <div class="ring"></div>
      <div>LOADING GALLERY · 图鉴加载中</div>
    </div>
    <iframe id="artFrame" data-src="game-art-gallery/index.html" title="游戏美术风格图鉴"></iframe>
  </div>
  <div class="panel" id="panel-meta" role="tabpanel" aria-labelledby="tab-meta">
    <iframe src="game-meta-systems.html" title="天赋·成就·经济系统研究档案"></iframe>
  </div>
  <div class="panel" id="panel-ui" role="tabpanel" aria-labelledby="tab-ui">
    <iframe src="game-ui-design.html" title="UI 美术设计研究档案"></iframe>
  </div>
  <div class="panel" id="panel-cyber" role="tabpanel" aria-labelledby="tab-cyber">
    <iframe src="dark-cyber.html" title="暗黑赛博 UI 风格分析合集"></iframe>
  </div>
</div>

<script>
(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var panels={td:document.getElementById('panel-td'),art:document.getElementById('panel-art'),meta:document.getElementById('panel-meta'),ui:document.getElementById('panel-ui'),cyber:document.getElementById('panel-cyber')};
  var titles={
    td:'塔防游戏全景研究档案 · 游戏研究资料库',
    art:'游戏美术风格图鉴 · 游戏研究资料库',
    meta:'天赋·成就·经济系统档案 · 游戏研究资料库',
    ui:'UI 美术设计档案 · 游戏研究资料库',
    cyber:'暗黑赛博 UI 风格分析合集 · 游戏研究资料库'
  };
  var artFrame=document.getElementById('artFrame');
  var artLoading=document.getElementById('artLoading');
  var artLoaded=false;

  /* 图鉴页含 240 张图,首次切换到该页签时才加载 */
  function ensureArtLoaded(){
    if(artLoaded)return;
    artLoaded=true;
    artFrame.addEventListener('load',function(){
      artLoading.classList.add('done');
    });
    artFrame.src=artFrame.getAttribute('data-src');
  }

  function activate(name,push){
    tabs.forEach(function(t){
      var on=t.getAttribute('data-target')===name;
      t.classList.toggle('active',on);
      t.setAttribute('aria-selected',on?'true':'false');
    });
    Object.keys(panels).forEach(function(k){
      panels[k].classList.toggle('show',k===name);
    });
    if(name==='art')ensureArtLoaded();
    document.title=titles[name]||titles.td;
    if(push!==false)history.replaceState(null,'','#'+name);
  }

  tabs.forEach(function(t){
    t.addEventListener('click',function(){activate(t.getAttribute('data-target'));});
  });

  /* 支持 #art / #td / #meta / #ui / #cyber 直达链接 */
  var hash=(location.hash||'').replace('#','');
  activate(panels.hasOwnProperty(hash)?hash:'td',false);
})();
</script>
</body>
</html>
